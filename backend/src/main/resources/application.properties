spring.application.name=backend

spring.datasource.url=jdbc:postgresql://localhost:5432/nailsalon
spring.datasource.username=nailsalon
spring.datasource.password=localdev

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
# Admin (Agneta). The password has NO default here: set the ADMIN_PASSWORD environment variable in production,
# otherwise the app refuses to start. Locally it comes from application-local.properties (gitignored).
app.admin.username=agneta
app.admin.password=${ADMIN_PASSWORD}
spring.profiles.default=local

# Error responses: readable message, but never a stack trace
spring.web.error.include-message=always
spring.web.error.include-stacktrace=never
