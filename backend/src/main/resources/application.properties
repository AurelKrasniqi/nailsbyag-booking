spring.application.name=backend

spring.datasource.url=jdbc:postgresql://localhost:5432/nailsalon
spring.datasource.username=nailsalon
spring.datasource.password=localdev

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
# Admin (Agneta). The password has NO default here: set the ADMIN_PASSWORD environment variable in production,
# otherwise the app refuses to start. Locally it comes from application-local.properties (gitignored).
app.admin.username=agneta
app.admin.password=${ADMIN_PASSWORD}
spring.profiles.default=local

# Error responses: readable message, but never a stack trace
spring.web.error.include-message=always
spring.web.error.include-stacktrace=never

# Payments. provider is "fake" (development: a fake payment page in our own frontend), "vipps" (the real thing)
# or "none" (online payment switched off: customers pay at the salon).
# There is NO default on purpose: the fake gateway lets anyone "pay" for free, so production must choose explicitly.
# Locally these come from application-local.properties (gitignored).
app.payment.provider=${PAYMENT_PROVIDER}
app.payment.frontend-base-url=${FRONTEND_BASE_URL}
app.payment.hold-minutes=10

# Only read when provider=vipps. Credentials from the Vipps MobilePay portal, supplied as environment variables.
app.payment.vipps.base-url=${VIPPS_BASE_URL:https://apitest.vipps.no}
app.payment.vipps.client-id=${VIPPS_CLIENT_ID}
app.payment.vipps.client-secret=${VIPPS_CLIENT_SECRET}
app.payment.vipps.subscription-key=${VIPPS_SUBSCRIPTION_KEY}
app.payment.vipps.merchant-serial-number=${VIPPS_MERCHANT_SERIAL_NUMBER}

# Text messages when a booking is confirmed. provider is "none" (default, nothing is sent), "log" (development:
# the message is only written to the log) or "twilio" (the real thing). Secrets only as environment variables.
app.sms.provider=${SMS_PROVIDER:none}
# Only read when provider=twilio. "from" is a Twilio number or an approved sender name.
app.sms.twilio.account-sid=${TWILIO_ACCOUNT_SID:}
app.sms.twilio.auth-token=${TWILIO_AUTH_TOKEN:}
app.sms.twilio.from=${TWILIO_FROM:}

# E-mail to Agneta with the full booking details. provider is "none" (default), "log" (development: only written
# to the log) or "resend" (the real thing). admin-address is where the mail goes; empty = no mail.
app.email.provider=${EMAIL_PROVIDER:none}
app.email.admin-address=${ADMIN_EMAIL:}
# Only read when provider=resend. "from" must be on the verified domain, e.g. "The Beauty Room <booking@thebeautyroombyag.no>"
app.email.from=${EMAIL_FROM:}
app.email.resend.api-key=${RESEND_API_KEY:}

# Hosting: the platform tells us which port to listen on, and TLS is ended by its proxy in front of us
server.port=${PORT:8080}
server.forward-headers-strategy=framework
